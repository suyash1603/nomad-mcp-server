name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Build
        run: make build

      # The binary must answer --version without a Nomad anywhere in sight.
      # It is the first thing anyone runs after downloading a release.
      - name: Smoke test the binary
        run: |
          ./bin/nomad-mcp-server --version
          ./bin/nomad-mcp-server --help > /dev/null

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -coverpkg=./pkg/... ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  e2e:
    name: End-to-end against a real Nomad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Community Edition specifically. An Enterprise build refuses
      # `nomad agent -dev` with "invalid license config: empty license", and the
      # e2e suite would skip rather than fail — which would look like a pass.
      - name: Install Nomad
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y nomad
          nomad version

      - name: Fail if Nomad is missing or Enterprise
        run: |
          if ! command -v nomad >/dev/null; then
            echo "nomad is not installed; the e2e suite would silently skip"
            exit 1
          fi
          if nomad version | grep -q '+ent'; then
            echo "an Enterprise nomad cannot run 'agent -dev'; the suite would skip"
            exit 1
          fi

      - name: End-to-end tests
        run: make test-e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Advisory, not a gate. This module targets Go 1.26, and golangci-lint
    # releases lag new Go versions by weeks — it refuses to start with "the Go
    # language version used to build golangci-lint is lower than the targeted
    # Go version", which is a toolchain mismatch rather than anything wrong
    # with this code. The actual gates are gofmt, go vet and the test suite in
    # the build job, all of which block. Once golangci-lint supports the Go
    # version in go.mod, drop continue-on-error and pin the version.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is intended to be publishable. The scan is deliberately
      # narrow — a Nomad token assigned to a recognisable variable — because a
      # broad one would fire on every UUID in the test fixtures and be ignored
      # within a week.
      - name: Scan for assigned tokens
        run: |
          if grep -rniE \
            'NOMAD_TOKEN[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{20,}' \
            --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::a token-shaped value is assigned to NOMAD_TOKEN in the tree"
            exit 1
          fi
          echo "clean"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nomad-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs and speaks MCP
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm -e NOMAD_ADDR=http://127.0.0.1:4646 \
                nomad-mcp-server:ci stdio \
            | tee /dev/stderr \
            | grep -q '"serverInfo"'
