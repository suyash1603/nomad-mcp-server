name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Build
        run: make build

      # The binary must answer --version without a Nomad anywhere in sight.
      # It is the first thing anyone runs after downloading a release.
      - name: Smoke test the binary
        run: |
          ./bin/nomad-mcp-server --version
          ./bin/nomad-mcp-server --help > /dev/null

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out -coverpkg=./pkg/... ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  e2e:
    name: End-to-end against a real Nomad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Community Edition specifically. An Enterprise build refuses
      # `nomad agent -dev` with "invalid license config: empty license", and the
      # e2e suite would skip rather than fail — which would look like a pass.
      - name: Install Nomad
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y nomad
          nomad version

      - name: Fail if Nomad is missing or Enterprise
        run: |
          if ! command -v nomad >/dev/null; then
            echo "nomad is not installed; the e2e suite would silently skip"
            exit 1
          fi
          if nomad version | grep -q '+ent'; then
            echo "an Enterprise nomad cannot run 'agent -dev'; the suite would skip"
            exit 1
          fi

      - name: End-to-end tests
        run: make test-e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint is installed with `go install` rather than through its
      # action or its install script, for two reasons found the hard way:
      #
      #   - The install script verifies a checksum that did not match the
      #     release tarball, failing the job with what looks like a supply-chain
      #     alarm. Going through the module proxy uses Go's own checksum
      #     database instead.
      #   - Building it with this module's toolchain means it is always at least
      #     as new as the `go` directive. The action's prebuilt binary lagged and
      #     refused to start: "the Go language version (go1.24) used to build
      #     golangci-lint is lower than the targeted Go version (1.26.5)".
      #
      # This is slower than a prebuilt binary — a couple of minutes — but it
      # cannot drift out of step with the Go version this project targets.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          golangci-lint --version
          golangci-lint run --timeout=5m ./...

  secrets:
    name: No secrets in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is intended to be publishable, so nothing token-shaped
      # should be assigned to a credential variable anywhere in it.
      #
      # Test files are excluded from the token pattern, and that exclusion is
      # deliberate rather than a concession: the HTTP leak tests must contain
      # token-shaped strings, because their whole purpose is to assert that such
      # a value in a query string is rejected with a 400. On its first run this
      # check failed on its own fixture. A scan that fires on the tests proving
      # the guard works is a scan people learn to ignore.
      #
      # The other three checks apply everywhere, tests included.
      - name: Scan for assigned tokens
        run: |
          fail=0

          echo "--- tokens assigned to a credential variable (non-test files) ---"
          if grep -rniE \
            '(NOMAD_TOKEN|SECRET_ID|ACL_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{20,}' \
            --include='*.go' --include='*.md' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.hcl' --include='*.sh' --include='Dockerfile' \
            --exclude='*_test.go' --exclude-dir=.git . ; then
            echo "::error::a token-shaped value is assigned to a credential variable"
            fail=1
          fi

          echo "--- committed private keys ---"
          if git ls-files | grep -iE '\.(pem|key|p12|pfx)$' ; then
            echo "::error::a key file is tracked"
            fail=1
          fi

          echo "--- committed environment files ---"
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::a .env file is tracked"
            fail=1
          fi

          echo "--- PEM blocks anywhere in the tree ---"
          if grep -rlE --exclude-dir=.git -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' . ; then
            echo "::error::a private key block is present"
            fail=1
          fi

          [ $fail -eq 0 ] && echo "clean"
          exit $fail

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nomad-mcp-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs and speaks MCP
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm -e NOMAD_ADDR=http://127.0.0.1:4646 \
                nomad-mcp-server:ci stdio \
            | tee /dev/stderr \
            | grep -q '"serverInfo"'
